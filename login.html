<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <main class="auth-card">
        <header class="mb-4">
            <h3 class="fw-bold m-0">MatchFlow</h3>
            <p class="text-secondary small mt-1">Match-first hiring platform</p>
        </header>

        <section id="login-section">
            <h4 class="fw-bold mb-3">Sign In</h4>
            <form id="login-form">
                <div class="mb-3 position-relative">
                    <label class="small text-secondary mb-1">Email</label>
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" class="form-control" id="login-email" required>
                </div>
                <div class="mb-3 position-relative">
                    <label class="small text-secondary mb-1">Password</label>
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" class="form-control" id="login-password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small text-secondary" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="text-secondary small text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary mb-3">Sign In</button>
            </form>
            <div class="text-center small text-secondary">
                Don't have an account? <a href="#" id="show-register" class="text-white fw-bold text-decoration-none">Create account</a>
            </div>
        </section>
    </main>
    <script src="login-auth.js"></script>
</body>
</html>
